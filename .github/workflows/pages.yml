# Publishes the Growth OS site to GitHub Pages.
#
# One-time setup after this lands: repository Settings → Pages → Build and
# deployment → Source: "GitHub Actions". Then every push that touches the app
# republishes the site automatically.
name: Deploy Growth OS to Pages

on:
  push:
    branches: [main]
    paths:
      - 'instagram-growth-os/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Rebuild from source so the published site can never drift from the
      # committed modules.
      - name: Build the site
        working-directory: instagram-growth-os
        run: node build.js

      - name: Check the build produced a real page
        working-directory: instagram-growth-os
        run: |
          test -s public/index.html
          grep -q "<title>" public/index.html
          grep -q "IGOS" public/index.html

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: instagram-growth-os/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
